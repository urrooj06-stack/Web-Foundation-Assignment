<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Day 11: Dynamic Forms</title>
</head>
<body>
    <h2>Contact Form with Dynamic Summary</h2>
    <form id="contact-form">
        <input type="text" id="name" placeholder="Your Name" required><br><br>
        <input type="email" id="email" placeholder="Your Email" required><br><br>
        <button type="submit">Submit</button>
    </form>
    <div id="summary" style="margin-top: 20px; padding: 10px; background: #f0fdf4; display: none;"></div>
    
    <script src="formsUI.js"></script>
</body>
</html>
